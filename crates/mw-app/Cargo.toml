[package]
name = "mw-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MicWright desktop app built with GPUI: the Linux app, and a test app on Windows"

[[bin]]
name = "micwright"
path = "src/main.rs"

[dependencies]
mw-dsp = { path = "../mw-dsp" }
mw-engine = { path = "../mw-engine" }
anyhow = "1"
cpal = "0.18"
gpui-kit = "0.8.1"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Tray icon (StatusNotifierItem over D-Bus, pure Rust).
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
# Global hotkeys: the desktop portal on Wayland, a key grab on X11.
ashpd = { version = "0.13", default-features = false, features = ["async-io", "global_shortcuts"] }
async-io = "2"
futures-util = { version = "0.3", default-features = false }
x11rb = "0.13"
# Quit cleanly (hand the default mic back) on logout, kill and Ctrl+C.
signal-hook = "0.3"
