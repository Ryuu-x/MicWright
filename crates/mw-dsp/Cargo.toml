[package]
name = "mw-dsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MicWright voice processing chain (no I/O, real-time safe)"

[dependencies]
nnnoiseless = { version = "0.5", default-features = false }
# DeepFilterNet3 (higher-quality noise + reverb removal). Optional: pulls in the tract
# inference engine and an embedded model (~8 MB of code + weights).
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", default-features = false, features = ["tract", "default-model-ll"], optional = true }
ndarray = { version = "0.15", optional = true }
# libDF only builds against tract 0.21.4 (later 0.21.x changed the API); pin the whole family.
tract-core = { version = "=0.21.4", optional = true }
tract-data = { version = "=0.21.4", optional = true }
tract-hir = { version = "=0.21.4", optional = true }
tract-linalg = { version = "=0.21.4", optional = true }
tract-nnef = { version = "=0.21.4", optional = true }
tract-onnx = { version = "=0.21.4", optional = true }
tract-onnx-opl = { version = "=0.21.4", optional = true }
tract-pulse = { version = "=0.21.4", optional = true }
tract-pulse-opl = { version = "=0.21.4", optional = true }

[features]
deepfilter = ["dep:deep_filter", "dep:ndarray", "dep:tract-core", "dep:tract-data", "dep:tract-hir", "dep:tract-linalg", "dep:tract-nnef", "dep:tract-onnx", "dep:tract-onnx-opl", "dep:tract-pulse", "dep:tract-pulse-opl"]

