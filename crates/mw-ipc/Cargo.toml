[package]
name = "mw-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared-memory block between the MicWright APO (audiodg) and the tray app"

[dependencies]
mw-dsp = { path = "../mw-dsp" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }
